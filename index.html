<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="Freight quotation generator for logistics companies">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freight Quotation Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
<header class="toolbar no-print">
  <div class="brand">Freight Quotation Generator</div>
  <div>
    <button id="newQuote" class="btn btn-light">New</button>
    <button id="printBtn" class="btn btn-primary">Print / PDF</button>
  </div>
</header>

<main class="page" id="quotationPage">

  <section class="header">
    <div class="header-left">
      <img src="logo.png" alt="Company Logo" class="logo" width=78p height=auto>
      <div>
        <h1>Prestige International Logistics (Pvt) Ltd</h1>
        <p>Colombo, Sri Lanka</p>
      </div>
    </div>
    <div class="header-right">
      <h2>Quotation</h2>
      <p id="quoteNo"></p>
    </div>
  </section>

  <section class="meta-grid">
    <div class="panel">
      <h3>Client Details</h3>
      <input id="clientName" placeholder="Client Name">
      <input id="clientCompany" placeholder="Company">
      <textarea id="clientAddress" placeholder="Address"></textarea>
    </div>

    <div class="panel">
      <h3>Details</h3>
      <input id="quoteDate" type="date">
      <input id="validTill" type="date">
      <select id="mode">
        <option>Sea Freight</option>
        <option>Air Freight</option>
      </select>
    </div>
  </section>

  <section class="panel">
    <h3>Charges</h3>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Description</th>
          <th>Qty</th>
          <th>Rate</th>
          <th>Total</th>
          <th class="no-print"></th>
        </tr>
      </thead>
      <tbody id="chargeBody"></tbody>
    </table>
    <button id="addRowBtn" class="btn btn-success no-print">+ Add</button>
  </section>

  <section class="total-panel">
    <h2 id="grandTotal">Total: 0.00 USD</h2>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
